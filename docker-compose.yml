version: '3.8'

services:
  db:
    image: postgres:15
    container_name: lifepilot-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lifepilot
    ports:
      - "5432:5432"
    volumes:
      - lifepilot-pgdata:/var/lib/postgresql/data

volumes:
  lifepilot-pgdata:
